{% extends "base.html" %}

{% block title %} Criar conta {% endblock %}

{% block content %}
<style>
        /* Cores Customizadas (Reutilizando as cores do seu Navbar/Rodapé) */
        .text-custom-blue {
            color: #1a56db; 
        }
        .bg-custom-orange {
            background-color: #f97316; 
        }
        .text-custom-orange {
            color: #f97316; 
        }
    </style>

<div class="md:p-8 flex flex-col md:flex-row">


    <!-- Formulário de Criação de Conta -->
        <div class="w-full md:w-1/2 lg:w-5/12 xl:w-4/12 bg-white p-8 sm:p-10 rounded-xl shadow-lg border border-gray-200">
            
            <h1 class="text-2xl font-bold text-gray-800 text-center mb-1">CRIAR CONTA</h1>
            <p class="text-sm text-gray-600 text-center mb-8">
                Preencha o formulário com os seus dados <br> para criar a sua conta.
            </p>

            <form action="#" method="POST" class="space-y-6">

                <div class="space-y-4">
                    <p class="text-sm font-semibold text-gray-700 border-b border-gray-300 pb-2">
                        Informe os dados da Instituição
                    </p>

                    <div>
                        <label for="nome_instituicao" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                            <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l10 5-10 5-10-5 10-5zm0 17v-10"/><path d="M4 12v6l8 4 8-4v-6"/></svg>
                            Nome da Instituição
                        </label>
                        <input type="text" id="nome_instituicao" name="nome_instituicao" placeholder="Digite o Nome" required
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                    </div>

                    <div>
                        <label for="email_instituicao" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                            <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            Email da Instituição
                        </label>
                        <input type="email" id="email_instituicao" name="email_instituicao" placeholder="Digite o Email" required
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                    </div>

                    <div>
                        <label for="endereco_instituicao" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                            <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            Endereça da Instituição
                        </label>
                        <input type="text" id="endereco_instituicao" name="endereco_instituicao" placeholder="Digite o Endereço" required
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                    </div>
                </div> <div class="pt-4 space-y-4">
                    <p class="text-sm font-semibold text-gray-700 border-b border-gray-300 pb-2">
                        Informe os dados do Responsável da conta
                    </p>

                    <div>
                        <label for="nome_responsavel" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                            <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Nome do Responsável
                        </label>
                        <input type="text" id="nome_responsavel" name="nome_responsavel" placeholder="Digite o nome completo" required
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                    </div>

                    <div>
                        <label for="telefone_responsavel" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                            <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2 4.18V2.82A2 2 0 0 1 4.18 2 2.75 2.75 0 0 1 5 2.25c.16.08.32.17.47.27l1.88 1.1a1 1 0 0 1 .45 1.48L5.75 8.25a1 1 0 0 0 0 1.5l3 3a1 1 0 0 0 1.5 0l2.75-2.05a1 1 0 0 1 1.48.45l1.1 1.88c.1.15.19.31.27.47.07.16.04.34-.09.47l-1.5 1.5A2.75 2.75 0 0 0 22 16.92z"/></svg>
                            Telefone do Responsável
                        </label>
                        <input type="tel" id="telefone_responsavel" name="telefone_responsavel" placeholder="Digite o nº de telefone" required
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                    </div>
                </div>

                <div>
                    <label for="password" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                        <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Palavra Pass
                    </label>
                    <input type="password" id="password" name="password" placeholder="Digite a sua palavra pass" required
                           class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                </div>

                <div>
                    <label for="confirm_password" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                        <svg class="w-5 h-5 mr-2 text-custom-orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Confirme a Palavra Pass
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Digite a sua palavra pass" required
                           class="w-full p-2 border border-gray-300 rounded-lg focus:ring-custom-blue focus:border-custom-blue" />
                </div>

                <button type="submit" 
                        class="w-full py-2.5 mt-4 text-lg font-semibold text-white bg-custom-orange rounded-3xl shadow-md hover:bg-orange-600 transition duration-150">
                    CRIAR
                </button>
            </form>
            
            <p class="text-sm text-center mt-4">
                Já tem uma conta? 
                <a href="#" class="text-custom-blue font-semibold hover:text-blue-700">Faça login.</a>
            </p>

        </div> 
        
        <!-- Ilustração ao lado do formulário em telas maiores -->
        <div class="hidden md:flex md:w-1/2 lg:w-7/12 xl:w-8/12 p-8 justify-center items-center">
            <img src="placeholder_illustration.svg" alt="Ilustração de criação de conta" class="w-full max-w-lg h-auto" />
            
        </div>
</div>

{% endblock %}
