<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-[#7FB1DD] h-screen overflow-hidden flex">

    <!-- BOTÃO MENU MOBILE -->
    <button id="menuBtn"
        class="lg:hidden fixed top-4 left-4 z-50 bg-white p-2 rounded-lg shadow">
        <i class="fa-solid fa-bars text-black text-xl"></i>
    </button>

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="fixed lg:static inset-y-0 left-0 w-64 bg-[#7FB1DD]
               transform -translate-x-full lg:translate-x-0
               transition-transform duration-300 z-40
               px-6 py-8 flex flex-col h-screen">

        <!-- LOGO -->
        <div class="flex justify-center mb-6">
            <img src="{{ url_for('static', filename='imgs/rateShoollogo.svg') }}" alt="Rate School" class="w-20">
        </div>

        <!-- LINHA -->
        <div class="h-[2px] bg-yellow-400 mb-8"></div>

        <!-- MENU -->
        <nav class="flex flex-col gap-3 text-black font-medium">

            <!-- DASHBOARD ATIVO -->
            <a href="#"
               class="flex items-center gap-3 bg-white rounded-xl px-4 py-3 shadow">
                <i class="fa-solid fa-table-columns text-black"></i>
                <span>Dashboard</span>
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40">
                <i class="fa-regular fa-user text-black"></i>
                <span>Perfil</span>
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40">
                <i class="fa-regular fa-star text-black"></i>
                <span>Profs Avaliados</span>
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40">
                <i class="fa-solid fa-list-check text-black"></i>
                <span>Outras Avaliações</span>
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40 mt-6">
                <i class="fa-solid fa-right-from-bracket text-black"></i>
                <span>Sair</span>
            </a>

        </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 bg-white rounded-l-[40px] p-6 lg:p-10 shadow-xl overflow-hidden flex flex-col">

        <!-- HEADER FIXO -->
        <div class="flex items-center justify-between mb-6 flex-shrink-0">

            <!-- Ano letivo -->
            <div class="flex items-center gap-3 border px-4 py-2 rounded-lg">
                <i class="fa-regular fa-calendar text-black"></i>
                <select name="ano_letivo" id="ano_letivo" class="bg-white">
                    <option value="2025/26">2025/26</option>
                    <option value="2026/27">2024/25</option>
                    <option value="2027/28">2023/24</option>
                </select>
            </div>

            <!-- Logout -->
            <a href="#" class="text-black text-xl">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
        </div>

        <!-- LINHA FIXA -->
        <div class="h-[2px] bg-black/70 mb-6 flex-shrink-0"></div>

        <!-- CONTEÚDO COM SCROLL -->
        <div class="flex-1 overflow-y-auto overflow-x-hidden pr-1"><br>

            {% block content %}
            {% endblock %}

        </div>

    </main>


    <!-- SCRIPT MENU MOBILE -->
    <script>
        const btn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');

        btn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });
    </script>

</body>
</html>
