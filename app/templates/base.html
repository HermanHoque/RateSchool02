<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RateSchool{% endblock %}</title>
  <favicon href="{{ url_for('static', filename='imgs/rateShoollogo.svg') }}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  

  <style>
    
    /* Animação suave do menu mobile lateral */
    #mobile-menu {
      transition: transform 0.3s ease-in-out;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen bg-white">

  <!-- Navbar -->
  <header class="bg-white shadow-md fixed w-full top-0 left-0 z-50">
    <nav class="container mx-auto flex justify-between items-center py-3 px-4 md:px-10">
      
      <!-- Lado Esquerdo (Logo + Home) -->
      <div class="flex items-center space-x-4">
        <img src="{{ url_for('static', filename='imgs/rateShoollogo.svg') }}" alt="RateSchool Logo" class="w-14 h-14">
        <a href="{{ url_for('index.index') }}" class="border border-[#0A66C2] text-[#0A66C2] py-1.5 px-5 rounded-full text-sm font-semibold hover:bg-[#0A66C2] hover:text-white transition duration-300">
          HOME
        </a>
      </div>

      <!-- Menu Desktop -->
      <ul class="hidden md:flex items-center space-x-6 text-sm font-semibold text-blue-700">
        <li><a href="#" class="hover:underline">SOBRE NÓS</a></li>
        <li>
          <a href="{{ url_for('escola.login') }}" class="border border-[#0A66C2] text-[#0A66C2] bg-white py-1.5 px-5 rounded-full hover:bg-[#0A66C2] hover:text-white transition duration-300">
            LOGIN
          </a>
        </li>
        <li>
          <a href="{{ url_for('escola.criarConta') }}" class="border border-[#F59E0B] bg-[#F59E0B] text-white py-1.5 px-5 rounded-full hover:bg-yellow-600 transition duration-300">
            CRIAR CONTA
          </a>
        </li>
      </ul>

      <!-- Botão Hamburger -->
      <div class="md:hidden flex items-center">
        <button id="menu-btn" class="focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Menu Mobile lateral direita -->
    <div id="mobile-menu" class="fixed top-0 right-0 h-full w-64 bg-white shadow-lg transform translate-x-full z-40">
      <div class="flex justify-end p-4">
        <button id="close-menu" class="text-blue-700 text-2xl font-bold focus:outline-none">&times;</button>
      </div>
      <div class="flex flex-col items-center py-4 text-blue-700 font-semibold space-y-4">
        <a href="#" class="hover:text-blue-500 transition duration-200">SOBRE NÓS</a>
        <hr class="w-10/12 border-gray-300">
        <a href="#" class="hover:text-blue-500 transition duration-200">LOGIN</a>
        <hr class="w-10/12 border-gray-300">
        <a href="#" class="hover:text-blue-500 transition duration-200">CRIAR CONTA</a>
      </div>
    </div>

  </header>

  <!-- Espaço para o conteúdo -->
  <main class="flex-grow pt-24 bg-white">
    
    <div class="container mx-auto px-10">

      <!-- Conteúdo específico da página será inserido aqui -->
       {% block content %}
       {% endblock %}
    </div>
   
  </main>

  <!-- Rodapé -->
  <footer class="bg-[#F9CA79] py-8 mt-10">
    <div class="container mx-auto text-center text-gray-800">
      <h2 class="text-[#0A66C2] text-2xl italic font-semibold">
        <a href="{{ url_for('index.index') }}">RateSchool</a>
      </h2>

      <div class="flex justify-center space-x-5 mt-3 text-gray-800 text-xl">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>

      <div class="border-t border-gray-400 mt-5 w-10/12 md:w-1/2 mx-auto"></div>
      <p class="mt-3 italic">@ 2025 / RateSchool</p>
    </div>
  </footer>

  <!-- Script do Menu -->
  <script>
    const btn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-menu');
    const menu = document.getElementById('mobile-menu');

    btn.addEventListener('click', () => {
      menu.classList.remove('translate-x-full');
      menu.classList.add('translate-x-0');
    });

    closeBtn.addEventListener('click', () => {
      menu.classList.add('translate-x-full');
      menu.classList.remove('translate-x-0');
    });
  </script>

</body>
</html>
